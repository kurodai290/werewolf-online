<!doctype html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>オンライン人狼</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>

<main class="app">

  <h1>🐺 オンライン人狼</h1>

  <p class="sub">
    5〜10人で遊べます
  </p>


  <!-- ================= -->
  <!-- ホーム -->
  <!-- ================= -->

  <section
    id="home"
    class="card"
  >

    <input
      id="name"
      maxlength="12"
      placeholder="名前"
    >

    <button id="create">
      ルームを作る
    </button>

    <div class="line">
      または
    </div>

    <input
      id="code"
      maxlength="6"
      placeholder="ルームコード"
    >

    <button id="join">
      ルームに参加
    </button>

  </section>


  <!-- ================= -->
  <!-- ルーム -->
  <!-- ================= -->

  <section
    id="room"
    class="card hidden"
  >

    <h2>
      ルーム
      <span id="roomCode"></span>
    </h2>

    <p id="phase">
      待機中
    </p>

    <div id="players"></div>


    <!-- ゲーム開始 -->

    <button
      id="start"
      class="hidden"
    >
      ゲーム開始
    </button>


    <!-- ★管理者リセット -->

    <button
      id="reset"
      class="reset hidden"
    >
      🔄 ゲームをリセット
    </button>

  </section>


  <!-- ================= -->
  <!-- ゲーム -->
  <!-- ================= -->

  <section
    id="game"
    class="card hidden"
  >

    <h2 id="roleTitle">
      役職
    </h2>

    <p id="roleText"></p>

    <div id="actionArea"></div>

  </section>


  <!-- メッセージ -->

  <section
    id="message"
    class="message"
  ></section>


</main>


<script
  src="https://cdn.socket.io/4.8.1/socket.io.min.js"
></script>

<script src="app.js"></script>

</body>

</html>
